<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FUTURE TV | Live Television</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080d17;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            height: 75px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #202b3d;
            background: #0c1422;
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .logo span {
            color: #269cff;
        }

        .status {
            color: #39dc91;
            font-size: 12px;
            letter-spacing: 2px;
        }

        main {
            max-width: 1250px;
            margin: 55px auto;
            padding: 0 22px;
        }

        .intro {
            margin-bottom: 35px;
        }

        .intro h1 {
            font-size: clamp(32px, 5vw, 52px);
            margin-bottom: 12px;
        }

        .intro h1 span {
            color: #269cff;
        }

        .intro p {
            color: #8c9bb1;
            font-size: 16px;
        }

        .player-section {
            background: #111c2d;
            border: 1px solid #26364c;
            border-radius: 15px;
            overflow: hidden;
        }

        .player-header {
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #26364c;
        }

        .player-header h2 {
            font-size: 19px;
        }

        .live-badge {
            background: #b92335;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .player-controls {
            padding: 18px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            background: #1689e8;
            color: #fff;
            border: none;
            border-radius: 7px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0874cb;
        }

        .channel-info {
            margin-left: auto;
            color: #8c9bb1;
            font-size: 13px;
        }

        #message {
            padding: 0 22px 18px;
            color: #9aabc0;
            font-size: 13px;
        }

        .error {
            color: #ff7777 !important;
        }

        footer {
            margin-top: 80px;
            padding: 30px;
            border-top: 1px solid #202b3d;
            text-align: center;
            color: #65758b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 18px;
            }

            .logo {
                font-size: 21px;
            }

            main {
                margin-top: 35px;
            }

            .channel-info {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">FUTURE<span>TV</span></div>
    <div class="status">● STREAMING PLATFORM</div>
</header>

<main>

    <section class="intro">
        <h1>Welcome to <span>FUTURE TV</span></h1>
        <p>Dein Fernsehen. Jederzeit. Überall.</p>
    </section>

    <section class="player-section">

        <div class="player-header">
            <h2>ShowTürk</h2>
            <span class="live-badge">● LIVE</span>
        </div>

        <video id="video" controls playsinline></video>

        <div class="player-controls">
            <button id="playButton" type="button">
                ▶ Stream starten
            </button>

            <button id="reloadButton" type="button">
                ↻ Neu laden
            </button>

            <span class="channel-info">
                ShowTürk · Live TV
            </span>
        </div>

        <div id="message" aria-live="polite">
            Bereit zum Abspielen.
        </div>

    </section>

</main>

<footer>
    FUTURE TV · Streaming Platform
</footer>

<script>
    const video = document.getElementById("video");
    const message = document.getElementById("message");

    const streamUrl =
        "https://github.com/world-cmyk/Vision/raw/refs/heads/main/streams/showturk.m3u8";

    let hls = null;

    function setMessage(text, isError = false) {
        message.textContent = text;
        message.className = isError ? "error" : "";
    }

    function loadStream() {
        if (hls) {
            hls.destroy();
            hls = null;
        }

        video.pause();
        video.removeAttribute("src");
        video.load();

        setMessage("Lade ShowTürk-Stream ...");

        if (Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: false
            });

            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                setMessage("Stream geladen. Klicke auf Stream starten.");

            });

            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    setMessage(
                        "Wiedergabefehler: " +
                        data.details +
                        ". Möglicherweise blockiert CORS den Stream.",
                        true
                    );

                    hls.destroy();
                    hls = null;
                }
            });

        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
            video.src = streamUrl;

            video.addEventListener("loadedmetadata", function () {
                setMessage("Stream geladen. Klicke auf Stream starten.");
            }, { once: true });

            video.addEventListener("error", function () {
                setMessage("Der Stream konnte nicht geladen werden.", true);
            }, { once: true });

        } else {
            setMessage("Dein Browser unterstützt HLS nicht.", true);
        }
    }

    document.getElementById("playButton").addEventListener("click", async function () {
        try {
            await video.play();
            setMessage("ShowTürk wird abgespielt.");
        } catch (error) {
            setMessage("Wiedergabe fehlgeschlagen: " + error.message, true);
        }
    });

    document.getElementById("reloadButton").addEventListener("click", function () {
        loadStream();
    });

    loadStream();
</script>

</body>
</html>
